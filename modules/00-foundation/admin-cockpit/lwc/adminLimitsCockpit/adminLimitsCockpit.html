<template>
    <lightning-card title="Nexus Core - Admin & Limits Cockpit" icon-name="standard:dashboard">
        <lightning-button-icon
            slot="actions"
            icon-name="utility:refresh"
            alternative-text="Refresh telemetry"
            title="Refresh telemetry"
            onclick={handleRefresh}
        ></lightning-button-icon>
        <div class="slds-p-horizontal_medium slds-is-relative">
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading Telemetry..." size="small"></lightning-spinner>
            </template>
            <template lwc:if={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">{errorMessage}</div>
            </template>
            <template lwc:if={snapshot}>
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                    <h3 class="slds-text-title_bold">Org Resource Telemetry</h3>
                    <div class="slds-text-body_small slds-text-color_weak">
                        Overall health
                        <span class={snapshot.overallBadgeClass} data-id="overall-status">{snapshot.overallStatus}</span>
                        &middot; as of
                        <lightning-formatted-date-time
                            value={snapshot.generatedAt}
                            hour="2-digit"
                            minute="2-digit"
                            second="2-digit"
                        ></lightning-formatted-date-time>
                    </div>
                </div>
                <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_large">
                    <template for:each={snapshot.limits} for:item="lim">
                        <div key={lim.name} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                            <div class="slds-box slds-box_x-small" data-id="limit-tile">
                                <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                    <span class="slds-text-body_regular">{lim.label}</span>
                                    <span class={lim.badgeClass}>{lim.status}</span>
                                </div>
                                <lightning-progress-bar
                                    value={lim.percentUsed}
                                    size="large"
                                    variant={lim.progressVariant}
                                ></lightning-progress-bar>
                                <div class="slds-text-align_right slds-text-color_weak slds-text-body_small slds-m-top_xx-small">
                                    {lim.current} / {lim.max} ({lim.percentUsed}%)
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
                <h3 class="slds-text-title_bold slds-m-bottom_small">Recent Exception Feed (Nebula Logger)</h3>
                <template lwc:if={hasErrors}>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col" style="width: 7rem"><div class="slds-truncate" title="Severity">Severity</div></th>
                                <th scope="col"><div class="slds-truncate" title="Message">Message</div></th>
                                <th scope="col"><div class="slds-truncate" title="Origin">Origin</div></th>
                                <th scope="col" style="width: 11rem"><div class="slds-truncate" title="Timestamp">Timestamp</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={snapshot.recentErrors} for:item="err">
                                <tr key={err.logId} data-id="error-row">
                                    <td><span class={err.badgeClass}>{err.severity}</span></td>
                                    <td><div class="slds-truncate" title={err.message}>{err.message}</div></td>
                                    <td><div class="slds-truncate" title={err.origin}>{err.origin}</div></td>
                                    <td>
                                        <lightning-formatted-date-time
                                            value={err.loggedTime}
                                            year="numeric"
                                            month="short"
                                            day="2-digit"
                                            hour="2-digit"
                                            minute="2-digit"
                                        ></lightning-formatted-date-time>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template lwc:if={showNoErrors}>
                    <p class="slds-text-color_success" data-id="no-errors">No ERROR or WARN entries logged.</p>
                </template>
                <template lwc:if={snapshot.errorFeedMessage}>
                    <div class="slds-notify slds-notify_alert slds-alert_warning" role="alert" data-id="feed-unavailable">
                        {snapshot.errorFeedMessage}
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
